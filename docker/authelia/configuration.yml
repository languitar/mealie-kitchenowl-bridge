---
# Authelia acts as the bridge's OIDC provider for the local dev stack (see
# docker-compose.yml and README's "Local dev stack" section). All secrets
# below, including the TLS/OIDC-signing key material in ./tls/, are
# throwaway values for local-only testing, committed on purpose - never
# reuse this file (or ./tls/) for a real deployment.
#
# Authelia requires its own external URL to use https:// (its session
# cookies are always Secure), so it terminates TLS itself here with a
# self-signed certificate (./tls/cert.pem, ./tls/key.pem). Everything is
# addressed as 127.0.0.1 rather than localhost, since Authelia's cookie
# domain validation requires either a dotted domain or an IP address.

theme: light

server:
  address: 'tcp://:9091'
  tls:
    certificate: /config/tls/cert.pem
    key: /config/tls/key.pem

log:
  level: info

# Skip the NTP clock-sync startup check: local dev containers often can't
# reach an NTP server (or run with enough clock drift to fail it), and it's
# irrelevant for this throwaway dev-only instance.
ntp:
  disable_startup_check: true

identity_validation:
  reset_password:
    jwt_secret: 'f002956e2f67acbd8852d7afacfccde146b5ad636603fdd8ac013882dc817876'

totp:
  disable: true

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: one_factor

session:
  secret: '957650b4c8a8f7408c0ff10d4cae0f28b4ace0e2837f9675b2b20c9b6175dd47'
  cookies:
    # No default_redirection_url: Authelia requires it to use https://, but
    # none of the dev stack's apps (bridge, Mealie, KitchenOwl) serve TLS.
    # It's only used when visiting Authelia directly with no login target in
    # flight - every real flow here (bridge, Mealie, KitchenOwl OIDC logins)
    # carries its own redirect_uri, so this is safe to leave unset.
    - domain: '127.0.0.1'
      authelia_url: 'https://127.0.0.1:9091'

storage:
  encryption_key: 'c07561d27f90cdf544ae993240f9e53c3a01f8a4e2bfeffd79189a577f1f26a0'
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt

