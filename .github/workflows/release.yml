# Triggered off Test *completing* rather than `push: branches: [main]`
# directly, so a release only ever happens once the test suite has actually
# passed for that commit - a plain `needs:` can't express that across
# separate workflow files, so this reacts to the Test workflow run itself.
name: Release

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # semantic-release needs to push a commit/tag and create a GitHub
    # release; publish-image.yml then reacts to *this* workflow completing
    # (see its comment) rather than to that push, since a push made with
    # GITHUB_TOKEN wouldn't trigger it directly.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Node packages
        uses: actions/cache@v4
        with:
          path: node_modules
          key: release-${{ hashFiles('package.json') }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
