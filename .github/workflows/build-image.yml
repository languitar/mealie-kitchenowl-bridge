# Reusable build/push logic shared by test.yml (PR/main build validation,
# push: false) and publish-image.yml (actual GHCR publishing, push: true) -
# keeps the checkout/login/buildx/build-push-action steps in exactly one
# place instead of duplicated across those two workflows.
name: Build image

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tags:
        required: false
        type: string
        default: ""
      push:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ inputs.push }}
          tags: ${{ inputs.tags }}
