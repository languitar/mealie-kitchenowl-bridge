name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-commits:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v6

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  # Build-only (push: false by default), so a broken Dockerfile shows up as
  # a PR status check instead of only being discovered after merge, once
  # publish-image.yml tries to build the same source for real.
  build-image:
    uses: ./.github/workflows/build-image.yml
    with:
      ref: ${{ github.sha }}
