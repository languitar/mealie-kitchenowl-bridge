# Publishes the OCI image to GHCR for two cases: a release (version tag +
# latest) and every main commit that passes tests (dev tag + short sha +
# build date). Triggered off *other workflows completing* rather than a
# plain `push` trigger, because the commit/tag that would normally trigger
# this is pushed by release.yml using the default GITHUB_TOKEN - and GitHub
# refuses to let GITHUB_TOKEN-authored pushes trigger further workflows (a
# hardcoded recursion guard, no repo setting overrides it). workflow_run is
# the standard way around that: react to the *workflow run* finishing
# instead of the push it made. Listening to both "Test" and "Release" lets
# one job distinguish "just a green main commit" from "a release happened"
# via github.event.workflow_run.name.
name: Publish image

on:
  workflow_run:
    workflows: ["Test", "Release"]
    types: [completed]
    branches: [main]

jobs:
  metadata:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      # For a "Release" run, workflow_run.head_sha is the commit Release was
      # *triggered for* - i.e. the pre-release commit, not the one
      # semantic-release actually tags. semantic-release pushes a new commit
      # (version bump) plus the release tag on top of that as part of its
      # own run, so by the time Release finishes, main's tip has moved past
      # head_sha. Checking out head_sha for a release therefore lands on an
      # untagged commit. This doesn't apply to "Test" runs - nothing
      # rewrites main between Test finishing and this job running, so
      # head_sha is the right commit there.
      #
      # Resolve main's *sha* via ls-remote rather than checking out the
      # branch name "main" directly: actions/checkout given a branch name
      # checks out a real local branch (`git branch --show-current` reports
      # "main"), not a detached HEAD, which matters for the tag lookup
      # below.
      - name: Determine commit to build
        id: ref
        run: |
          if [ "${{ github.event.workflow_run.name }}" = "Release" ]; then
            sha=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1)
            echo "ref=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          # Full history + tags: needed for `git tag --points-at` below to
          # see whether HEAD is exactly on a release tag.
          fetch-depth: 0

      # Compute the actual tag values ourselves with plain git rather than
      # relying on docker/metadata-action's `context: git` auto-detection.
      # That auto-detection turned out to be unreliable in practice: on a
      # real release commit it resolved to a malformed, comma-polluted ref
      # (`refs/tags/v1.0.2, origin/main`) even though the checkout was
      # correctly detached and on the right commit - a bug in its own
      # decoration-string parsing on GitHub-hosted runners that didn't
      # reproduce against a local clone with the same primitives. `git tag
      # --points-at HEAD` alone was verified repeatedly (locally and against
      # the actual released commits) to give a clean answer, so that's what
      # drives the tags below - metadata-action is only used afterwards for
      # tag-list/label formatting, not for figuring out what to tag.
      - name: Determine build metadata
        id: build_meta
        run: |
          echo "tag=$(git tag --points-at HEAD | head -1)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.build_meta.outputs.tag }},enable=${{ steps.build_meta.outputs.tag != '' }}
            type=raw,value=latest,enable=${{ steps.build_meta.outputs.tag != '' }}
            type=raw,value=dev,enable=${{ github.event.workflow_run.name == 'Test' }}
            type=raw,value=${{ steps.build_meta.outputs.short_sha }},enable=${{ github.event.workflow_run.name == 'Test' }}
            type=raw,value=${{ steps.build_meta.outputs.date }},enable=${{ github.event.workflow_run.name == 'Test' }}

  publish:
    needs: metadata
    # A completed "Release" run doesn't guarantee a release was actually
    # cut - semantic-release no-ops cleanly when there's nothing to
    # release, in which case the metadata job above emits no tags at all.
    # Skip publishing entirely rather than repush an unchanged image.
    if: ${{ needs.metadata.outputs.tags != '' }}
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.metadata.outputs.ref }}
      tags: ${{ needs.metadata.outputs.tags }}
      push: true
