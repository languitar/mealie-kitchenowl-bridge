# Publishes the OCI image to GHCR for two cases: a release (version tag +
# latest) and every main commit that passes tests (dev tag + short sha +
# build date). Triggered off *other workflows completing* rather than a
# plain `push` trigger, because the commit/tag that would normally trigger
# this is pushed by release.yml using the default GITHUB_TOKEN - and GitHub
# refuses to let GITHUB_TOKEN-authored pushes trigger further workflows (a
# hardcoded recursion guard, no repo setting overrides it). workflow_run is
# the standard way around that: react to the *workflow run* finishing
# instead of the push it made. Listening to both "Test" and "Release" lets
# one job distinguish "just a green main commit" from "a release happened"
# via github.event.workflow_run.name.
name: Publish image

on:
  workflow_run:
    workflows: ["Test", "Release"]
    types: [completed]
    branches: [main]

jobs:
  metadata:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      # For a "Release" run, workflow_run.head_sha is the commit Release was
      # *triggered for* - i.e. the pre-release commit, not the one
      # semantic-release actually tags. semantic-release pushes a new commit
      # (version bump) plus the release tag on top of that as part of its
      # own run, so by the time Release finishes, main's tip has moved past
      # head_sha. Checking out head_sha for a release therefore lands on an
      # untagged commit and silently produces no version tag at all. This
      # doesn't apply to "Test" runs - nothing rewrites main between Test
      # finishing and this job running, so head_sha is the right commit
      # there.
      #
      # Resolve main's *sha* via ls-remote rather than checking out the
      # branch name "main" directly: actions/checkout given a branch name
      # checks out a real local branch (`git branch --show-current` reports
      # "main"), not a detached HEAD. metadata-action's context: git only
      # runs its tag-lookup logic when HEAD is detached - on a named branch
      # it takes the branch's own ref instead and never looks for a tag at
      # all, even if one happens to sit on that exact commit. Learned this
      # the hard way: an earlier version of this fix used `ref: main`
      # directly, landed on the right commit, and *still* found no tag for
      # exactly this reason.
      - name: Determine commit to build
        id: ref
        run: |
          if [ "${{ github.event.workflow_run.name }}" = "Release" ]; then
            sha=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1)
            echo "ref=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          # Full history + tags: needed for metadata-action's `context: git`
          # (below) to see whether HEAD is exactly on a release tag.
          fetch-depth: 0

      # `context: git` makes this inspect the actual checked-out commit
      # instead of the triggering GitHub event - required here because for
      # a workflow_run-triggered job, the event's own ref/sha just describe
      # the workflow run, not the release tag (if any) sitting on HEAD.
      #
      # The `enable=` flags key off which workflow completed, since that's
      # a plain, reliable GitHub-context value - unlike branch/tag
      # detection under `context: git`, which only needs to work here for
      # tags (verified against metadata-action's source), not branches.
      #
      # `latest` is handled by metadata-action's default `latest=auto`
      # flavor: it only appears alongside a `type=semver` match, i.e. only
      # when this run is for a real release - no separate condition needed.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event.workflow_run.name == 'Release' }}
            type=raw,value=dev,enable=${{ github.event.workflow_run.name == 'Test' }}
            type=sha,format=short,enable=${{ github.event.workflow_run.name == 'Test' }}
            type=raw,value={{date 'YYYY-MM-DD'}},enable=${{ github.event.workflow_run.name == 'Test' }}

  publish:
    needs: metadata
    # A completed "Release" run doesn't guarantee a release was actually
    # cut - semantic-release no-ops cleanly when there's nothing to
    # release, in which case the metadata job above emits no tags at all.
    # Skip publishing entirely rather than repush an unchanged image.
    if: ${{ needs.metadata.outputs.tags != '' }}
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.metadata.outputs.ref }}
      tags: ${{ needs.metadata.outputs.tags }}
      push: true
