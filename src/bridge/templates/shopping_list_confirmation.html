{% extends "base.html" %}

{% block title %}Added to {{ shopping_list_name }}{% endblock %}

{% block content %}
<div class="notification is-success">
  Added {{ ingredients | length }} ingredient(s) to "{{ shopping_list_name }}".
</div>
<ul>
  {% for ingredient in ingredients %}
  <li>{{ ingredient.name }}</li>
  {% endfor %}
</ul>
{% endblock %}
