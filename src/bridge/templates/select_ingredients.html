{% extends "base.html" %}

{% block title %}Select ingredients for "{{ shopping_list_name }}"{% endblock %}

{% block content %}
<h1>Add ingredients to "{{ shopping_list_name }}"</h1>
<form method="post" action="{{ url_for('review.push_to_shopping_list', list_id=list_id) }}">
  <ul>
    {% for ingredient in ingredients %}
    <li>
      <label>
        <input type="checkbox" name="ingredient" value="{{ ingredient.name }}" checked />
        {{ ingredient.name }}
      </label>
      <input type="hidden" name="quantity:{{ ingredient.name }}" value="{{ ingredient.quantity or '' }}" />
      <select name="item_choice:{{ ingredient.name }}">
        <option value="new" {% if not matches.get(ingredient.name) %}selected{% endif %}>Create new item</option>
        {% for item in items %}
        <option value="{{ item.id }}" {% if matches.get(ingredient.name) and matches[ingredient.name].id == item.id %}selected{% endif %}>{{ item.name }}</option>
        {% endfor %}
      </select>
    </li>
    {% endfor %}
  </ul>
  <button type="submit">Add to shopping list</button>
</form>
{% endblock %}
