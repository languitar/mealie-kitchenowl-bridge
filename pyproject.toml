[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bridge"
version = "0.1.0"
description = "Bridge that pushes Mealie recipe ingredients onto a KitchenOwl shopping list"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-bdd>=7.0",
    "pytest-flask>=1.3",
    "pytest-playwright>=0.5",
    "requests-mock>=1.12",
    "ruff>=0.6",
    "testcontainers>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: real-browser scenario via Playwright + pytest-flask's live_server (opt-in: pytest -m browser)",
]
addopts = ["-m", "not browser"]
live_server_scope = "function"
filterwarnings = [
    # pytest-bdd 8.1.0's compat shim still calls a pytest-internal fixture
    # registration API using the (pytest 10-removed) nodeid= argument. Not
    # something we control; remove once pytest-bdd ships a fix.
    "ignore:Passing nodeid to _register_fixture is deprecated:pytest.PytestRemovedIn10Warning",
    "ignore:Passing baseid to FixtureDef is deprecated:pytest.PytestRemovedIn10Warning",
    # gherkin-official (a pytest-bdd dependency) still calls re.split() with a
    # positional maxsplit argument; surfaces once a feature file has a tag
    # line (e.g. @browser). Not something we control; remove once fixed
    # upstream.
    "ignore:'maxsplit' is passed as positional argument:DeprecationWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
